<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c0392b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Cozinha — Restaurante</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#1a1a1a;min-height:100vh;color:#f0f0f0;padding-bottom:60px}
.header{background:#c0392b;padding:.8rem 1.2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:700}
.hright{display:flex;gap:.5rem;align-items:center}
.hright span{font-size:13px;opacity:.8}
.bsm{padding:.35rem .7rem;border:1.5px solid rgba(255,255,255,.4);border-radius:8px;background:transparent;color:#fff;font-size:12px;cursor:pointer}
.filtros{display:flex;gap:.5rem;padding:.7rem 1rem;background:#222;overflow-x:auto;border-bottom:1px solid #333}
.fb{padding:.38rem .85rem;border:1.5px solid #444;border-radius:18px;background:transparent;color:#aaa;font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.fb.ativo{border-color:#e8a020;background:#2a1e00;color:#e8a020}
.cont{padding:1rem;max-width:960px;margin:0 auto}
.pcard{background:#242424;border-radius:14px;margin-bottom:.8rem;overflow:hidden;border-left:5px solid #555}
.pcard.pendente{border-color:#e8a020}
.pcard.preparo {border-color:#3498db}
.pcard.pronto  {border-color:#27ae60}
.pcard.entregue{border-color:#444;opacity:.45}
.phead{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem;border-bottom:1px solid #2e2e2e}
.pmesa{font-size:22px;font-weight:700}
.pmeta{font-size:12px;color:#777;margin-top:2px}
.sb{font-size:11px;padding:3px 10px;border-radius:8px;font-weight:600}
.s-pendente{background:#2a1e00;color:#e8a020}
.s-preparo {background:#001a33;color:#3498db}
.s-pronto  {background:#0a2215;color:#27ae60}
.s-entregue{background:#222;color:#666}
.pitens{padding:.8rem 1rem}
.plinha{display:flex;align-items:center;gap:.8rem;padding:.5rem 0;border-bottom:.5px solid #2e2e2e;font-size:15px}
.plinha:last-child{border:none}
.pqtd{background:#2e2e2e;border-radius:8px;padding:4px 12px;font-size:15px;font-weight:700;min-width:42px;text-align:center}
.pnome{flex:1;color:#f0f0f0}
.pfoot{padding:.7rem 1rem;border-top:1px solid #2e2e2e;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.timer{font-size:14px;font-weight:600;color:#e8a020;font-family:monospace}
.timer.urgente{color:#e74c3c}
.pacoes{display:flex;gap:.5rem}
.ba{padding:.42rem .9rem;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600}
.ba-ini {background:#1a3a5c;color:#fff}
.ba-prt {background:#1a4a2a;color:#fff}
.ba-ent {background:#333;color:#aaa}
.ba-imp {background:#2e2e2e;color:#ccc}
.empty{text-align:center;color:#555;padding:3rem;font-size:15px}
.ping{position:fixed;top:65px;right:1rem;background:#c0392b;color:#fff;padding:.4rem .9rem;border-radius:20px;font-size:12px;font-weight:600;display:none;z-index:200;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:#555;color:#fff;padding:.65rem 1.2rem;border-radius:12px;font-size:14px;z-index:999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="header">
  <h1>👨‍🍳 Cozinha</h1>
  <div class="hright">
    <span id="nomeUser"></span>
    <button class="bsm" onclick="sair()">Sair</button>
  </div>
</div>

<div class="filtros">
  <button class="fb ativo" onclick="filtrar('todos',this)">Todos</button>
  <button class="fb" onclick="filtrar('pendente',this)">🟡 Pendente</button>
  <button class="fb" onclick="filtrar('preparo',this)">🔵 Em preparo</button>
  <button class="fb" onclick="filtrar('pronto',this)">🟢 Pronto</button>
  <button class="fb" onclick="filtrar('entregue',this)">✓ Entregue</button>
</div>

<div class="cont"><div id="lista"></div></div>
<div class="ping" id="ping">🔔 Novo pedido!</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script>
const SB = getSB();
let usuario, pedidos = [], filtroSt = 'todos', timers = {};

(async () => {
  usuario = checarAuth(['admin','cozinha']);
  if (!usuario) return;
  document.getElementById('nomeUser').textContent = usuario.nome;
  await carregar();
  assinarRealtime();
})();

async function carregar() {
  const { data } = await SB.from('pedidos').select('*').eq('tipo','cozinha').order('criado_em');
  pedidos = data || [];
  render();
}

function filtrar(st, el) {
  filtroSt = st;
  document.querySelectorAll('.fb').forEach(b => b.classList.remove('ativo'));
  el.classList.add('ativo');
  render();
}

const SL = { pendente:'Pendente', preparo:'Em preparo', pronto:'Pronto p/ entrega', entregue:'Entregue' };

function render() {
  const el = document.getElementById('lista');
  const ordem = { pendente:0, preparo:1, pronto:2, entregue:3 };
  let lista = filtroSt === 'todos' ? pedidos : pedidos.filter(p => p.status === filtroSt);
  lista = [...lista].sort((a,b) => (ordem[a.status]??4)-(ordem[b.status]??4) || new Date(a.criado_em)-new Date(b.criado_em));
  if (!lista.length) { el.innerHTML = '<div class="empty">Nenhum pedido no momento 👍</div>'; return; }
  el.innerHTML = lista.map(p => `
    <div class="pcard ${p.status}">
      <div class="phead">
        <div>
          <div class="pmesa">Mesa ${p.mesa}</div>
          <div class="pmeta">Pedido #${p.id} — ${new Date(p.criado_em).toLocaleTimeString('pt-BR')}</div>
        </div>
        <span class="sb s-${p.status}">${SL[p.status]||p.status}</span>
      </div>
      <div class="pitens">
        ${p.itens.map(i => `
          <div class="plinha">
            <span class="pqtd">${i.qtd}x</span>
            <span class="pnome">${i.nome}</span>
          </div>`).join('')}
      </div>
      <div class="pfoot">
        <span class="timer" id="tmr-${p.id}">--:--</span>
        <div class="pacoes">
          ${p.status==='pendente' ? `<button class="ba ba-ini" onclick="mudar(${p.id},'preparo')">▶ Iniciar</button>` : ''}
          ${p.status==='preparo'  ? `<button class="ba ba-prt" onclick="mudar(${p.id},'pronto')">✓ Pronto</button>` : ''}
          ${p.status==='pronto'   ? `<button class="ba ba-ent" onclick="mudar(${p.id},'entregue')">✓ Retirado</button>` : ''}
          <button class="ba ba-imp" onclick='imprimirPedido(${JSON.stringify(p).replace(/'/g,"&#39;")})'>🖨️</button>
        </div>
      </div>
    </div>`).join('');
  iniciarTimers(lista);
}

function iniciarTimers(lista) {
  Object.values(timers).forEach(clearInterval);
  timers = {};
  lista.forEach(p => {
    const el = document.getElementById('tmr-' + p.id);
    if (!el || p.status === 'entregue') { if(el) el.textContent='✓'; return; }
    const inicio = new Date(p.criado_em).getTime();
    const atualizar = () => {
      const seg = Math.floor((Date.now() - inicio) / 1000);
      const m = Math.floor(seg / 60).toString().padStart(2,'0');
      const s = (seg % 60).toString().padStart(2,'0');
      if (el) {
        el.textContent = `${m}:${s}`;
        el.className = 'timer' + (seg > 600 ? ' urgente' : '');
      }
    };
    atualizar();
    timers[p.id] = setInterval(atualizar, 1000);
  });
}

async function mudar(id, status) {
  await SB.from('pedidos').update({ status }).eq('id', id);
  if (status === 'pronto') {
    const p = pedidos.find(x => x.id === id);
    if (p) falar(`Mesa ${p.mesa}, pedido pronto para retirada`);
  }
  carregar();
}

function notificar(p) {
  const ping = document.getElementById('ping');
  ping.style.display = 'block';
  setTimeout(() => ping.style.display = 'none', 4000);
  falar(`Novo pedido, mesa ${p.mesa}`);
  toast(`🔔 Mesa ${p.mesa} — novo pedido!`);
}

function assinarRealtime() {
  assinarTabela('pedidos', payload => {
    if (payload.eventType === 'INSERT' && payload.new.tipo === 'cozinha') {
      pedidos.unshift(payload.new);
      notificar(payload.new);
      render();
    }
    if (payload.eventType === 'UPDATE') {
      const idx = pedidos.findIndex(p => p.id === payload.new.id);
      if (idx >= 0) pedidos[idx] = payload.new; else pedidos.unshift(payload.new);
      render();
    }
    if (payload.eventType === 'DELETE') {
      pedidos = pedidos.filter(p => p.id !== payload.old.id);
      render();
    }
  });
}
</script>
</body>
</html>
