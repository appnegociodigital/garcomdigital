<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e8a020">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Mesa — Restaurante</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f0;min-height:100vh;padding-bottom:80px}
.header{background:#e8a020;color:#fff;padding:.9rem 1.2rem;text-align:center;position:sticky;top:0;z-index:100}
.header h1{font-size:20px;font-weight:700}
.header p{font-size:13px;opacity:.85;margin-top:.2rem}
.mesa-box{background:#fff;padding:.9rem 1.2rem;border-bottom:1px solid #eee;display:flex;align-items:center;gap:.8rem}
.mesa-box label{font-size:13px;font-weight:500;color:#444;white-space:nowrap}
.mesa-box select{flex:1;padding:.6rem .9rem;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;outline:none;background:#fff}
.mesa-box select:focus{border-color:#e8a020}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e0e0e0}
.tab{flex:1;padding:.75rem .5rem;font-size:13px;font-weight:500;cursor:pointer;color:#888;border-bottom:3px solid transparent;text-align:center}
.tab.ativo{color:#e8a020;border-color:#e8a020}
.badge{background:#e8a020;color:#fff;font-size:10px;padding:1px 5px;border-radius:8px;margin-left:3px}
.cont{padding:1rem;max-width:600px;margin:0 auto}
/* cardápio */
.cat-titulo{font-size:12px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.06em;margin:1rem 0 .5rem;padding-bottom:.3rem;border-bottom:1px solid #eee}
.icard{background:#fff;border-radius:12px;padding:.85rem 1rem;margin-bottom:.55rem;display:flex;align-items:center;gap:.8rem;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.iinfo{flex:1}
.inome{font-size:15px;font-weight:500;color:#1a1a1a}
.itipo{font-size:11px;color:#aaa;margin-top:2px}
.ipreco{font-size:14px;font-weight:600;color:#e8a020;margin-top:2px}
.ictrl{display:flex;align-items:center;gap:.4rem}
.bq{width:30px;height:30px;border:1.5px solid #e0e0e0;border-radius:8px;background:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.bq:hover{border-color:#e8a020;color:#e8a020}
.bq:active{background:#fff8ed}
.qval{font-size:15px;font-weight:700;min-width:22px;text-align:center}
.indis{opacity:.38;pointer-events:none}
/* carrinho */
.empty{text-align:center;color:#bbb;padding:2.5rem;font-size:14px}
.ci{background:#fff;border-radius:10px;padding:.75rem 1rem;margin-bottom:.5rem;display:flex;align-items:center;gap:.8rem;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.ci-info{flex:1}
.ci-nome{font-size:14px;font-weight:500}
.ci-sub{font-size:12px;color:#aaa;margin-top:2px}
.ci-preco{font-size:14px;font-weight:600;color:#e8a020}
.ci-rem{background:none;border:none;color:#e74c3c;font-size:20px;cursor:pointer;padding:.1rem .3rem;line-height:1}
.total-bar{background:#fff;border-radius:12px;padding:.9rem 1rem;margin-top:.6rem;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.tv{font-size:18px;font-weight:700}
.tv small{font-size:12px;color:#aaa;font-weight:400;display:block}
.benv{padding:.7rem 1.3rem;background:#e8a020;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.benv:disabled{background:#ccc;cursor:not-allowed}
/* chamar */
.chamar-box{background:#fff;border-radius:16px;padding:2rem 1.5rem;text-align:center;margin:.5rem 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.chamar-box .icon{font-size:52px;margin-bottom:.6rem}
.chamar-box h2{font-size:18px;font-weight:700;margin-bottom:.4rem}
.chamar-box p{font-size:14px;color:#888;margin-bottom:1.4rem;line-height:1.5}
.bchamar{padding:1rem 2rem;background:#e74c3c;color:#fff;border:none;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer;width:100%;transition:.15s}
.bchamar:hover{background:#c0392b}
.bchamar:active{transform:scale(.97)}
.bchamar:disabled{background:#bbb;cursor:not-allowed}
.cok{background:#d4edda;color:#155724;padding:.8rem 1rem;border-radius:10px;margin-top:.9rem;font-size:14px;text-align:center;display:none}
/* toast */
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:.65rem 1.2rem;border-radius:12px;font-size:14px;z-index:999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;max-width:90vw}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="header">
  <h1>🍽️ Cardápio</h1>
  <p id="hsub">Selecione sua mesa para começar</p>
</div>

<div class="mesa-box">
  <label>Mesa:</label>
  <select id="mesa-sel" onchange="selecionarMesa()">
    <option value="">— selecione —</option>
  </select>
</div>

<div class="tabs">
  <div class="tab ativo" onclick="tab('cardapio',this)">📋 Cardápio</div>
  <div class="tab" onclick="tab('carrinho',this)">🛒 Pedido<span class="badge" id="bc" style="display:none">0</span></div>
  <div class="tab" onclick="tab('garcom',this)">🔔 Garçom</div>
</div>

<div class="cont">
  <div id="t-cardapio"><div id="lista-card"></div></div>
  <div id="t-carrinho" style="display:none"><div id="lista-carr"></div></div>
  <div id="t-garcom" style="display:none">
    <div class="chamar-box">
      <div class="icon">🔔</div>
      <h2>Chamar Garçom</h2>
      <p>Toque no botão abaixo e o garçom será notificado imediatamente com o número da sua mesa.</p>
      <button class="bchamar" id="btn-chamar" onclick="chamarGarcom()">📣 Chamar Garçom</button>
      <div class="cok" id="cok">✅ Garçom notificado! Aguarde um momento.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script>
const SB = getSB();
let mesa = null;
let cardapio = [];
let carrinho = [];

// ── MESAS ─────────────────────────────────────────────────────────────────────
async function carregarMesas() {
  const { data } = await SB.from('grupos').select('*').order('id');
  const sel = document.getElementById('mesa-sel');

  // Verificar se veio mesa pela URL ?mesa=5
  const params = new URLSearchParams(location.search);
  const mesaURL = params.get('mesa');

  if (data && data.length) {
    data.forEach(g => {
      const grp = document.createElement('optgroup');
      grp.label = `${g.nome}${g.garcom ? ' — ' + g.garcom : ''}`;
      g.mesas.forEach(m => {
        const o = document.createElement('option');
        o.value = m; o.textContent = `Mesa ${m}`;
        if (String(m) === mesaURL) o.selected = true;
        grp.appendChild(o);
      });
      sel.appendChild(grp);
    });
  } else {
    for (let i = 1; i <= 30; i++) {
      const o = document.createElement('option');
      o.value = i; o.textContent = `Mesa ${i}`;
      if (String(i) === mesaURL) o.selected = true;
      sel.appendChild(o);
    }
  }
  if (mesaURL) selecionarMesa();
}

function selecionarMesa() {
  mesa = document.getElementById('mesa-sel').value || null;
  document.getElementById('hsub').textContent = mesa ? `Mesa ${mesa} selecionada` : 'Selecione sua mesa para começar';
}

// ── CARDÁPIO ──────────────────────────────────────────────────────────────────
async function carregarCardapio() {
  const { data } = await SB.from('cardapio').select('*').eq('disponivel', true).order('categoria').order('nome');
  cardapio = data || [];
  renderCardapio();
}

function renderCardapio() {
  const el = document.getElementById('lista-card');
  const cats = {};
  cardapio.forEach(i => { if (!cats[i.categoria]) cats[i.categoria] = []; cats[i.categoria].push(i); });
  el.innerHTML = Object.entries(cats).map(([cat, itens]) => `
    <div class="cat-titulo">${cat}</div>
    ${itens.map(i => {
      const qtd = carrinho.find(c => c.id === i.id)?.qtd || 0;
      return `<div class="icard">
        <div class="iinfo">
          <div class="inome">${i.nome}</div>
          <div class="itipo">${i.tipo === 'cozinha' ? '👨‍🍳 Cozinha' : '🛎️ Garçom'}</div>
          <div class="ipreco">R$ ${Number(i.preco).toFixed(2)}</div>
        </div>
        <div class="ictrl">
          <button class="bq" onclick="alt(${i.id},-1)">−</button>
          <span class="qval" id="q-${i.id}">${qtd}</span>
          <button class="bq" onclick="alt(${i.id},1)">+</button>
        </div>
      </div>`;
    }).join('')}
  `).join('');
}

function alt(id, d) {
  const item = cardapio.find(i => i.id === id); if (!item) return;
  const idx = carrinho.findIndex(c => c.id === id);
  if (idx >= 0) {
    carrinho[idx].qtd = Math.max(0, carrinho[idx].qtd + d);
    if (carrinho[idx].qtd === 0) carrinho.splice(idx, 1);
  } else if (d > 0) {
    carrinho.push({ id: item.id, nome: item.nome, preco: Number(item.preco), tipo: item.tipo, qtd: 1 });
  }
  atualizarBadge();
  const el = document.getElementById('q-' + id);
  if (el) el.textContent = carrinho.find(c => c.id === id)?.qtd || 0;
}

function atualizarBadge() {
  const total = carrinho.reduce((s, c) => s + c.qtd, 0);
  const b = document.getElementById('bc');
  b.textContent = total; b.style.display = total ? '' : 'none';
}

// ── CARRINHO ──────────────────────────────────────────────────────────────────
function renderCarrinho() {
  const el = document.getElementById('lista-carr');
  if (!carrinho.length) { el.innerHTML = '<div class="empty">🛒<br>Seu carrinho está vazio.<br>Adicione itens do cardápio.</div>'; return; }
  const total = carrinho.reduce((s, c) => s + c.preco * c.qtd, 0);
  el.innerHTML = `
    ${carrinho.map(c => `
      <div class="ci">
        <div class="ci-info">
          <div class="ci-nome">${c.nome}</div>
          <div class="ci-sub">${c.qtd}x — ${c.tipo === 'cozinha' ? '👨‍🍳 Cozinha' : '🛎️ Garçom'}</div>
        </div>
        <span class="ci-preco">R$ ${(c.preco * c.qtd).toFixed(2)}</span>
        <button class="ci-rem" onclick="remover(${c.id})">×</button>
      </div>`).join('')}
    <div class="total-bar">
      <div>
        <small>Total do pedido</small>
        <div class="tv">R$ ${total.toFixed(2)}</div>
      </div>
      <button class="benv" onclick="enviarPedido()" ${!mesa ? 'disabled title="Selecione a mesa"' : ''}>
        ${mesa ? '✅ Enviar' : 'Selecione a mesa'}
      </button>
    </div>`;
}

function remover(id) {
  carrinho = carrinho.filter(c => c.id !== id);
  atualizarBadge(); renderCarrinho();
}

async function enviarPedido() {
  if (!mesa) { toast('Selecione sua mesa primeiro'); return; }
  if (!carrinho.length) { toast('Carrinho está vazio'); return; }

  const garcomItens  = carrinho.filter(c => c.tipo === 'garcom');
  const cozinhaItens = carrinho.filter(c => c.tipo === 'cozinha');

  const inserir = async (itens, tipo) => {
    if (!itens.length) return;
    const total = itens.reduce((s, c) => s + c.preco * c.qtd, 0);
    await SB.from('pedidos').insert({ mesa: Number(mesa), itens, tipo, total, status: 'pendente' });
  };

  try {
    await Promise.all([inserir(garcomItens, 'garcom'), inserir(cozinhaItens, 'cozinha')]);
    carrinho = []; atualizarBadge();
    toast('✅ Pedido enviado com sucesso!');
    tab('cardapio', document.querySelector('.tab'));
    renderCardapio();
  } catch (e) {
    toast('Erro ao enviar pedido. Tente novamente.');
  }
}

// ── CHAMAR GARÇOM ─────────────────────────────────────────────────────────────
async function chamarGarcom() {
  if (!mesa) { toast('Selecione sua mesa primeiro'); return; }
  const btn = document.getElementById('btn-chamar');
  btn.disabled = true;
  try {
    // Descobrir garçom do grupo
    const { data: grupos } = await SB.from('grupos').select('*');
    const grupo = (grupos || []).find(g => g.mesas.includes(Number(mesa)));
    await SB.from('chamadas').insert({
      mesa: Number(mesa),
      atendida: false,
      garcom: grupo?.garcom || '',
      grupo_nome: grupo?.nome || ''
    });
    document.getElementById('cok').style.display = 'block';
    setTimeout(() => {
      document.getElementById('cok').style.display = 'none';
      btn.disabled = false;
    }, 8000);
  } catch (e) {
    toast('Erro ao chamar garçom');
    btn.disabled = false;
  }
}

// ── TABS ──────────────────────────────────────────────────────────────────────
function tab(id, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));
  el.classList.add('ativo');
  ['cardapio','carrinho','garcom'].forEach(t => document.getElementById('t-'+t).style.display = t===id?'':'none');
  if (id === 'carrinho') renderCarrinho();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
carregarMesas();
carregarCardapio();
</script>
</body>
</html>
